#cover.turning:before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 25%,#f0dfbd,#b6a07c);z-index:-1;animation:coverfade 1.05s cubic-bezier(.35,.02,.2,1) both}

'use strict';const $=s=>document.querySelector(s), names=['動物','人文','糖鐵','農作物','西拉雅／阿立祖','炸山資訊','獵人','竹林','華容道','地層','老照片'];const icons=['🐾','🏺','🚂','🌾','🧺','⛰️','🪶','🎋','🧩','🪨','📷'];let data={done:[],credits:0,saved:[],sound:false};try{Object.assign(data,JSON.parse(localStorage.getItem('guoxi-v1')||'{}'))}catch(e){}let page=Number.isInteger(data.lastPage)&&data.lastPage>=0&&data.lastPage<11?data.lastPage:0,cleanup=()=>{},audio,epoch=0;const save=()=>{try{localStorage.setItem('guoxi-v1',JSON.stringify(data))}catch(e){}};function tone(ok=true){if(!data.sound)return;try{audio??=new (window.AudioContext||window.webkitAudioContext)();audio.resume();[0,1,2].slice(0,ok?3:1).forEach((n)=>{let o=audio.createOscillator(),g=audio.createGain(),t=audio.currentTime+n*.09;o.frequency.value=ok?[440,550,660][n]:180;g.gain.setValueAtTime(.06,t);g.gain.exponentialRampToValueAtTime(.001,t+.16);o.connect(g).connect(audio.destination);o.start(t);o.stop(t+.17)})}catch(e){}}function msg(t,ok=true){$('#feedback').textContent=t;tone(ok)}function refresh(){ $('#progress').textContent=`完成 ${data.done.length}/11 ・ 抽取 ${data.credits} 次`;$('#sound').textContent='音效：'+(data.sound?'開':'關');$('#tabs').innerHTML=names.map((n,i)=>`<button class="${i===page?'on':''}" data-i="${i}">${icons[i]} ${n}${data.done.includes(i)?' ✓':''}</button>`).join('');$('#tabs').querySelectorAll('button').forEach(b=>b.onclick=()=>openPage(+b.dataset.i));$('#prev').disabled=page===0;$('#next').disabled=page===10}function modal(html){let o=$('#overlay');o.hidden=false;o.className='overlay';o.innerHTML=`<section class="modal" role="dialog" aria-modal="true">${html}</section>`;o.querySelector('button')?.focus()}function closeModal(){let o=$('#overlay');o.hidden=true;o.className='';o.innerHTML=''}function win(){if(finished)return;finished=true;cleanup();cleanup=()=>{};let fresh=!data.done.includes(page);if(fresh){data.done.push(page);data.credits++;save()}refresh();tone();modal(`<div class="pop"><div class="big">${icons[page]} ✦</div><span class="stamp">探索完成</span><h2>${names[page]}・採集成功</h2><p>${fresh?'獲得一次明信片抽取機會！':'已完成過，不重複發放抽取機會。'}</p></div><div class="row" style="justify-content:center"><button id="continue">繼續探索</button><button id="draw" ${data.done.length<3||!data.credits?'disabled':''}>抽取明信片</button><button id="stay">留在本頁</button></div>${data.done.length<3?'<small>完成至少三個不同主題後即可選擇三個元素。</small>':''}`);$('#continue').onclick=()=>{closeModal();openPage(Math.min(10,page+1))};$('#draw').onclick=collection;$('#stay').onclick=closeModal}let finished=false;function openPage(i){cleanup();cleanup=()=>{};epoch++;finished=false;page=i;data.lastPage=i;save();closeModal();refresh();$('#feedback').textContent='';$('#game').innerHTML=`<small>採集頁 ${String(i+1).padStart(2,'0')} / 11 ${data.done.includes(i)?'・已完成':''}</small><h2>${icons[i]} ${names[i]}</h2><div id="play"></div>`;games[i]();$('#tabs .on')?.scrollIntoView({block:'nearest',inline:'nearest'})}const play=()=>$('#play');const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};function buttons(items,fn,cols=3){let d=document.createElement('div');d.className='board';d.style.gridTemplateColumns=`repeat(${cols},1fr)`;items.forEach((v,i)=>{let b=document.createElement('button');b.className='tile';b.innerHTML=v;b.onclick=()=>{if(!finished)fn(i,b)};d.append(b)});play().append(d);return d}function intro(t){play().innerHTML=`<p>${t}</p>`}function loop(fn){let id,live=true,last=performance.now();function frame(t){if(!live)return;fn(Math.min(.05,(t-last)/1000),t);last=t;if(live)id=requestAnimationFrame(frame)}id=requestAnimationFrame(frame);cleanup=()=>{live=false;cancelAnimationFrame(id)}}function svgStage(content=''){let d=document.createElement('div');d.className='stage';d.innerHTML=`<svg viewBox="0 0 500 300" xmlns="http://www.w3.org/2000/svg">${content}</svg>`;play().append(d);return d}function pos(e,d){let svg=d.querySelector("svg"),m=svg.getScreenCTM();if(m){let p=new DOMPoint(e.clientX,e.clientY).matrixTransform(m.inverse());return [p.x,p.y]}let r=d.getBoundingClientRect();return [(e.clientX-r.left)*500/r.width,(e.clientY-r.top)*300/r.height]}function action(label,fn){let b=document.createElement('button');b.textContent=label;b.onclick=()=>{if(!finished)fn()};play().append(b);return b}
function animal(){const animals=[
 {name:'穿山甲',clues:['全身大多覆蓋瓦狀角質鱗片，遇到危險時會蜷縮成球。','沒有牙齒，靠細長而帶黏液的舌頭捕食白蟻。','四肢粗短，有銳利鉤爪，擅長刨土挖洞。'],info:'體長約30～100公分，四肢粗短，具有銳利鉤爪，善於刨土挖洞。除了腹部，全身覆蓋瓦狀角質鱗片；遇到危險會蜷縮成球，保護腹部。沒有牙齒，利用細長且帶黏液的舌頭捕食白蟻等昆蟲。'},
 {name:'白鼻心',clues:['額頭到鼻端有一條連續白線，是夜間活動的爬樹高手。','喜歡多汁果實，俗稱果子狸，長尾巴、黑色足部。','特殊的腳掌可以在細藤上行走，常用氣味做記號。'],info:'灰褐色身體，頭頂至鼻端有連續白線，眼睛周圍另有白斑。體型較鼬獾大，尾巴長，四肢粗短、末端黑色，每足五趾並有銳爪，善於爬樹與爬藤。夜行、常獨自活動，屬雜食性，喜歡多汁果實，也吃昆蟲、蝸牛及小型脊椎動物。又稱果子狸、烏腳香，會以臭腺分泌物防禦或留下氣味記號。'},
